services:
  nginx:
    image: nginx:1.30.3-alpine
    restart: always
    networks:
      - docker-kit-network
    ports:
      - "${NGINX_HTTP_PORT}:80"
      - "${NGINX_HTTPS_PORT}:443"
    environment:
      # 只替换白名单里的变量，避免 $host、$request_uri 等 nginx 内置变量被 envsubst 干掉
      NGINX_ENVSUBST_FILTER_VARIABLES: "BASE_DOMAIN NEXUS_HOSTNAME DANMU_HOSTNAME SAP_HOSTNAME GITEA_HOSTNAME NEXUS_SSL_PROFILE DANMU_SSL_PROFILE SAP_SSL_PROFILE GITEA_SSL_PROFILE"
      BASE_DOMAIN: ${BASE_DOMAIN}
      NEXUS_HOSTNAME: ${NEXUS_HOSTNAME}
      DANMU_HOSTNAME: ${DANMU_HOSTNAME}
      SAP_HOSTNAME: ${SAP_HOSTNAME}
      # 每个应用可独立选择证书套件：letsencrypt（默认）或 selfsigned
      NEXUS_SSL_PROFILE: ${NEXUS_SSL_PROFILE:-letsencrypt}
      DANMU_SSL_PROFILE: ${DANMU_SSL_PROFILE:-letsencrypt}
      SAP_SSL_PROFILE: ${SAP_SSL_PROFILE:-letsencrypt}
      GITEA_HOSTNAME: ${GITEA_HOSTNAME}
      GITEA_SSL_PROFILE: ${GITEA_SSL_PROFILE:-letsencrypt}
    volumes:
      # templates/*.template 会由官方镜像的启动脚本 envsubst 后输出到 /etc/nginx/conf.d/
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./certs:/etc/nginx/certs:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      # 静态站点内容（如 sap.zaqbest.com）
      - ./nginx/html:/usr/share/nginx/html:ro
    mem_limit: 128m

networks:
  docker-kit-network:
    external: true
