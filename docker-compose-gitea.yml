services:
  gitea-db:
    image: postgres:16-alpine
    container_name: gitea-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${GITEA_DB_NAME:-gitea}
      POSTGRES_USER: ${GITEA_DB_USER:-gitea}
      POSTGRES_PASSWORD: ${GITEA_DB_PASSWORD:-gitea123456}
      TZ: Asia/Shanghai
    volumes:
      - gitea_db_data:/var/lib/postgresql/data
    networks:
      - docker-kit-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${GITEA_DB_USER:-gitea} -d ${GITEA_DB_NAME:-gitea}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  gitea:
    image: gitea/gitea:1.23.7
    hostname: gitea
    restart: unless-stopped
    env_file:
      - env/gitea.env
    environment:
      TZ: Asia/Shanghai
      GITEA__database__DB_TYPE: postgres
      GITEA__database__HOST: gitea-db:5432
      GITEA__database__NAME: ${GITEA_DB_NAME:-gitea}
      GITEA__database__USER: ${GITEA_DB_USER:-gitea}
      GITEA__database__PASSWD: ${GITEA_DB_PASSWORD:-gitea123456}
    ports:
      - "${GITEA_HTTP_PORT:-3000}:3000"
      # 宿主机 2222 -> 容器内 2222（Gitea 内置 SSH，避开系统 sshd 的 22）
      - "${GITEA_SSH_PORT:-2222}:2222"
    volumes:
      - gitea_data:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    networks:
      - docker-kit-network
    depends_on:
      gitea-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/-/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  gitea_data:
    driver: local
  gitea_db_data:
    driver: local

networks:
  docker-kit-network:
    external: true
